# pnpm settings (pnpm >= 10.6 reads config from here, not package.json).
#
# Security overrides for transitive dev dependencies. Each key is scoped to the
# range its dependents declare, so only the vulnerable line is forced forward.
# Drop an entry once every dependent resolves to a patched version on its own.
overrides:
  # Host confusion. Pulled in by ajv.
  # GHSA-7p8r-x3mc-p8w7 (CVE-2026-18446), GHSA-4c8g-83qw-93j6 (CVE-2026-13676),
  # GHSA-v2hh-gcrm-f6hx (CVE-2026-16221)
  fast-uri@^3.0.1: ^3.1.5
  # GHSA-3jxr-9vmj-r5cp (CVE-2026-13149) — DoS via exponential-time expansion.
  # Pulled in by minimatch.
  brace-expansion@^5.0.5: ^5.0.7
